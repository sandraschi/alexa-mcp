[project]
name = "alexa-mcp"
version = "0.3.0"
description = "Alexa Acoustic Bridge - SOTA v14.1 Industrial MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.9",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "httpx>=0.27.0",
    "prefab-ui>=0.14.0",
    "miniaudio>=1.70",
    "certifi",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.4.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.16.0,<0.17"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
alexa-mcp = "alexa_mcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "S", "UP", "RUF", "C90", "N", "D", "ANN", "ASYNC", "T20"
]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "B008", "D100", "D104", "D107", "ANN101", "ANN102", "ANN204", "ASYNC109", "S106", "S110", "S112", "S101", "B008", "D100", "D104", "D107", "ANN101", "ANN102", "ANN204", "ASYNC109", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"verify_setup.py" = ["D103", "F401", "S110", "T201", "ASYNC240"]
"src/alexa_mcp/activity_log.py" = ["D102", "D103"]
"src/alexa_mcp/logs_api.py" = ["D103"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --tb=short"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
