[project]
name = "alexa-mcp"
version = "0.3.0"
description = "Alexa Acoustic Bridge - SOTA v14.1 Industrial MCP Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.9",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "ruff>=0.15.2",
    "httpx>=0.27.0",
    "prefab-ui>=0.14.0",
    "miniaudio>=1.70",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "coverage>=7.4.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
alexa-mcp = "alexa_mcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "S", "UP", "RUF", "C90", "N", "D", "ANN", "ASYNC", "T20"
]
ignore = [
    "S101", "B008", "D100", "D104", "D107", "ANN101", "ANN102", "ANN204", "ASYNC109"
]

[tool.ruff.lint.per-file-ignores]
"verify_setup.py" = ["D103", "F401", "S110", "T201", "ASYNC240"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
