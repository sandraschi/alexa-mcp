[project]
name = "alexa-mcp"
version = "0.1.0"
description = "MCP server to control Alexa via TTS and STT acoustic bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.9",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydub>=0.25.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
alexa-mcp = "alexa_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
