[project]
name = "alexa-mcp"
version = "0.1.0"
description = "MCP server to control Alexa via TTS and STT acoustic bridge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.1.0",
    "faster-whisper>=0.10.0",
    "edge-tts>=6.1.9",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydub>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
alexa-mcp = "alexa_mcp.server:main"
